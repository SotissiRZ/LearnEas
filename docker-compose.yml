x-backend-env: &backend-env
  # Valeurs par défaut adaptées au Docker LOCAL. En production (Railway),
  # définir explicitement DEBUG=False et une SECRET_KEY forte dans les variables d’environnement.
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
  DEBUG: ${DEBUG:-True}
  TEST_PAYMENTS_ENABLED: ${TEST_PAYMENTS_ENABLED:-True}
  ANON_THROTTLE_RATE: ${ANON_THROTTLE_RATE:-10000/hour}
  USER_THROTTLE_RATE: ${USER_THROTTLE_RATE:-30000/hour}
  MEDIA_THROTTLE_RATE: ${MEDIA_THROTTLE_RATE:-5000/hour}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  DATABASE_URL: postgres://${POSTGRES_USER:-learneas}:${POSTGRES_PASSWORD:-learneas}@db:5432/${POSTGRES_DB:-learneas}
  REDIS_URL: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
  USE_HTTPS: ${USE_HTTPS:-False}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  YOUCANPAY_ACCESS_TOKEN: ${YOUCANPAY_ACCESS_TOKEN:-}
  YOUCANPAY_API_BASE: ${YOUCANPAY_API_BASE:-https://youcanpay.com/api/v2}
  YOUCANPAY_SANDBOX_ACCESS_TOKEN: ${YOUCANPAY_SANDBOX_ACCESS_TOKEN:-}
  YOUCANPAY_SANDBOX_API_BASE: ${YOUCANPAY_SANDBOX_API_BASE:-}
  GENIUSPAY_API_KEY: ${GENIUSPAY_API_KEY:-}
  GENIUSPAY_API_SECRET: ${GENIUSPAY_API_SECRET:-}
  GENIUSPAY_WEBHOOK_SECRET: ${GENIUSPAY_WEBHOOK_SECRET:-}
  GENIUSPAY_API_BASE: ${GENIUSPAY_API_BASE:-https://geniuspay.ci/api/v1/merchant}
  GENIUSPAY_SANDBOX_API_KEY: ${GENIUSPAY_SANDBOX_API_KEY:-}
  GENIUSPAY_SANDBOX_API_SECRET: ${GENIUSPAY_SANDBOX_API_SECRET:-}
  GENIUSPAY_SANDBOX_WEBHOOK_SECRET: ${GENIUSPAY_SANDBOX_WEBHOOK_SECRET:-}
  GENIUSPAY_SANDBOX_API_BASE: ${GENIUSPAY_SANDBOX_API_BASE:-}
  PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-EUR}
  USE_S3: ${USE_S3:-False}
  REQUIRE_REMOTE_MEDIA: ${REQUIRE_REMOTE_MEDIA:-False}
  MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-2048}
  MAX_PDF_UPLOAD_MB: ${MAX_PDF_UPLOAD_MB:-100}
  MAX_IMAGE_UPLOAD_MB: ${MAX_IMAGE_UPLOAD_MB:-15}
  PRIVATE_MEDIA_TOKEN_MAX_AGE: ${PRIVATE_MEDIA_TOKEN_MAX_AGE:-43200}
  VIDEO_NORMALIZATION_ENABLED: ${VIDEO_NORMALIZATION_ENABLED:-True}
  VIDEO_PROBE_TIMEOUT_SECONDS: ${VIDEO_PROBE_TIMEOUT_SECONDS:-120}
  VIDEO_TRANSCODE_TIMEOUT_SECONDS: ${VIDEO_TRANSCODE_TIMEOUT_SECONDS:-3600}
  VIDEO_TRANSCODE_PRESET: ${VIDEO_TRANSCODE_PRESET:-veryfast}
  VIDEO_TRANSCODE_CRF: ${VIDEO_TRANSCODE_CRF:-22}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
  AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
  PLATFORM_COMMISSION_PERCENT: ${PLATFORM_COMMISSION_PERCENT:-15}
  MINIMUM_PAYOUT_AMOUNT: ${MINIMUM_PAYOUT_AMOUNT:-10}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-LearnEas <no-reply@learneas.com>}
  SEED_DEMO: ${SEED_DEMO:-false}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learneas}
      POSTGRES_USER: ${POSTGRES_USER:-learneas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learneas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learneas} -d ${POSTGRES_DB:-learneas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - learneas_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - learneas_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learneas_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "learneas", "worker", "--loglevel=info"]
    environment:
      <<: *backend-env
      SKIP_BOOTSTRAP: "true"
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learneas_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL relative par défaut : le navigateur appelle toujours l'API sur SA PROPRE origine
        # (que le site soit ouvert via http://localhost ou http://127.0.0.1), nginx la route en
        # interne vers le backend. Ne mettez une valeur absolue ici que pour un déploiement avec
        # un domaine public dédié différent du domaine du frontend.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_RTC_STUN_URL: ${NEXT_PUBLIC_RTC_STUN_URL:-stun:stun.l.google.com:19302}
        NEXT_PUBLIC_RTC_TURN_URL: ${NEXT_PUBLIC_RTC_TURN_URL:-}
        NEXT_PUBLIC_RTC_TURN_USERNAME: ${NEXT_PUBLIC_RTC_TURN_USERNAME:-}
        NEXT_PUBLIC_RTC_TURN_CREDENTIAL: ${NEXT_PUBLIC_RTC_TURN_CREDENTIAL:-}
        NEXT_PUBLIC_MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-2048}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_RTC_STUN_URL: ${NEXT_PUBLIC_RTC_STUN_URL:-stun:stun.l.google.com:19302}
      NEXT_PUBLIC_RTC_TURN_URL: ${NEXT_PUBLIC_RTC_TURN_URL:-}
      NEXT_PUBLIC_RTC_TURN_USERNAME: ${NEXT_PUBLIC_RTC_TURN_USERNAME:-}
      NEXT_PUBLIC_RTC_TURN_CREDENTIAL: ${NEXT_PUBLIC_RTC_TURN_CREDENTIAL:-}
      NEXT_PUBLIC_MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-2048}
      # URL interne au réseau Docker, utilisée UNIQUEMENT côté serveur (rendu SSR des pages
      # catalogue/détail) — "backend" est le nom du service ci-dessous, résolu par le DNS interne
      # de Docker. Ne pas mettre "localhost" ici : depuis CE conteneur, localhost = lui-même.
      INTERNAL_API_URL: http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - learneas_net
    expose:
      - "3000"
    healthcheck:
      # Ne jamais sonder `/` : la page d'accueil est un Server Component qui charge
      # catégories/cours/PDF et consommerait le quota DRF à chaque healthcheck.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - learneas_net

networks:
  learneas_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
