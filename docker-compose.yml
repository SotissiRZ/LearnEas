x-backend-env: &backend-env
  # Valeurs par défaut adaptées au Docker LOCAL. En production (Railway),
  # définir explicitement DEBUG=False et une SECRET_KEY forte dans les variables d’environnement.
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
  DEBUG: ${DEBUG:-True}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TEST_PAYMENTS_ENABLED: ${TEST_PAYMENTS_ENABLED:-True}
  ANON_THROTTLE_RATE: ${ANON_THROTTLE_RATE:-10000/hour}
  USER_THROTTLE_RATE: ${USER_THROTTLE_RATE:-30000/hour}
  MEDIA_THROTTLE_RATE: ${MEDIA_THROTTLE_RATE:-5000/hour}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  DATABASE_URL: postgresql://${POSTGRES_USER:-learneas}:${POSTGRES_PASSWORD:-learneas}@db:5432/${POSTGRES_DB:-learneas}
  REDIS_URL: redis://redis:6379/0
  DB_WAIT_MAX_ATTEMPTS: ${DB_WAIT_MAX_ATTEMPTS:-30}
  DB_WAIT_DELAY_SECONDS: ${DB_WAIT_DELAY_SECONDS:-2}
  DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-3}
  REALTIME_TICKET_MAX_AGE_SECONDS: ${REALTIME_TICKET_MAX_AGE_SECONDS:-60}
  REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000}
  REALTIME_CHANNEL_CAPACITY: ${REALTIME_CHANNEL_CAPACITY:-500}
  REALTIME_CHANNEL_EXPIRY_SECONDS: ${REALTIME_CHANNEL_EXPIRY_SECONDS:-60}
  RTC_STUN_URL: ${RTC_STUN_URL:-stun:stun.l.google.com:19302}
  RTC_TURN_URL: ${RTC_TURN_URL:-}
  RTC_TURN_SECRET: ${RTC_TURN_SECRET:-}
  RTC_TURN_TTL_SECONDS: ${RTC_TURN_TTL_SECONDS:-3600}
  RTC_TURN_USERNAME: ${RTC_TURN_USERNAME:-}
  RTC_TURN_CREDENTIAL: ${RTC_TURN_CREDENTIAL:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
  USE_HTTPS: ${USE_HTTPS:-False}
  AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-learneas_refresh}
  AUTH_REFRESH_COOKIE_PATH: ${AUTH_REFRESH_COOKIE_PATH:-/api/auth/}
  AUTH_REFRESH_COOKIE_DOMAIN: ${AUTH_REFRESH_COOKIE_DOMAIN:-}
  AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-False}
  AUTH_REFRESH_COOKIE_SAMESITE: ${AUTH_REFRESH_COOKIE_SAMESITE:-Lax}
  AUTH_REFRESH_COOKIE_MAX_AGE: ${AUTH_REFRESH_COOKIE_MAX_AGE:-604800}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
  BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  YOUCANPAY_ACCESS_TOKEN: ${YOUCANPAY_ACCESS_TOKEN:-}
  YOUCANPAY_API_BASE: ${YOUCANPAY_API_BASE:-https://youcanpay.com/api/v2}
  YOUCANPAY_SANDBOX_ACCESS_TOKEN: ${YOUCANPAY_SANDBOX_ACCESS_TOKEN:-}
  YOUCANPAY_SANDBOX_API_BASE: ${YOUCANPAY_SANDBOX_API_BASE:-}
  GENIUSPAY_API_KEY: ${GENIUSPAY_API_KEY:-}
  GENIUSPAY_API_SECRET: ${GENIUSPAY_API_SECRET:-}
  GENIUSPAY_WEBHOOK_SECRET: ${GENIUSPAY_WEBHOOK_SECRET:-}
  GENIUSPAY_API_BASE: ${GENIUSPAY_API_BASE:-https://geniuspay.ci/api/v1/merchant}
  GENIUSPAY_SANDBOX_API_KEY: ${GENIUSPAY_SANDBOX_API_KEY:-}
  GENIUSPAY_SANDBOX_API_SECRET: ${GENIUSPAY_SANDBOX_API_SECRET:-}
  GENIUSPAY_SANDBOX_WEBHOOK_SECRET: ${GENIUSPAY_SANDBOX_WEBHOOK_SECRET:-}
  GENIUSPAY_SANDBOX_API_BASE: ${GENIUSPAY_SANDBOX_API_BASE:-}
  CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
  CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
  CINETPAY_SECRET_KEY: ${CINETPAY_SECRET_KEY:-}
  CINETPAY_API_BASE: ${CINETPAY_API_BASE:-https://api-checkout.cinetpay.com/v2}
  CINETPAY_SANDBOX_API_KEY: ${CINETPAY_SANDBOX_API_KEY:-}
  CINETPAY_SANDBOX_SITE_ID: ${CINETPAY_SANDBOX_SITE_ID:-}
  CINETPAY_SANDBOX_SECRET_KEY: ${CINETPAY_SANDBOX_SECRET_KEY:-}
  CINETPAY_SANDBOX_API_BASE: ${CINETPAY_SANDBOX_API_BASE:-}
  PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-EUR}
  PAYMENT_RECONCILIATION_MIN_AGE_SECONDS: ${PAYMENT_RECONCILIATION_MIN_AGE_SECONDS:-120}
  PAYMENT_RECONCILIATION_BATCH_SIZE: ${PAYMENT_RECONCILIATION_BATCH_SIZE:-100}
  PAYMENT_ORDER_EXPIRY_HOURS: ${PAYMENT_ORDER_EXPIRY_HOURS:-24}
  PAYMENT_STALE_BATCH_SIZE: ${PAYMENT_STALE_BATCH_SIZE:-200}
  USE_S3: ${USE_S3:-False}
  REQUIRE_REMOTE_MEDIA: ${REQUIRE_REMOTE_MEDIA:-False}
  DIRECT_MEDIA_UPLOADS_ENABLED: ${DIRECT_MEDIA_UPLOADS_ENABLED:-False}
  DIRECT_UPLOAD_PART_SIZE_MB: ${DIRECT_UPLOAD_PART_SIZE_MB:-16}
  DIRECT_UPLOAD_URL_TTL_SECONDS: ${DIRECT_UPLOAD_URL_TTL_SECONDS:-3600}
  MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-2048}
  MAX_PDF_UPLOAD_MB: ${MAX_PDF_UPLOAD_MB:-100}
  MAX_IMAGE_UPLOAD_MB: ${MAX_IMAGE_UPLOAD_MB:-15}
  MAX_IMAGE_DIMENSION: ${MAX_IMAGE_DIMENSION:-12000}
  MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-60000000}
  CLIENT_TELEMETRY_THROTTLE_RATE: ${CLIENT_TELEMETRY_THROTTLE_RATE:-60/hour}
  PRIVATE_MEDIA_TOKEN_MAX_AGE: ${PRIVATE_MEDIA_TOKEN_MAX_AGE:-900}
  HLS_MEDIA_TOKEN_MAX_AGE: ${HLS_MEDIA_TOKEN_MAX_AGE:-21600}
  MALWARE_SCAN_ENABLED: ${MALWARE_SCAN_ENABLED:-False}
  MALWARE_SCAN_REQUIRED: ${MALWARE_SCAN_REQUIRED:-True}
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}
  VIDEO_NORMALIZATION_ENABLED: ${VIDEO_NORMALIZATION_ENABLED:-True}
  VIDEO_PROBE_TIMEOUT_SECONDS: ${VIDEO_PROBE_TIMEOUT_SECONDS:-120}
  VIDEO_TRANSCODE_TIMEOUT_SECONDS: ${VIDEO_TRANSCODE_TIMEOUT_SECONDS:-3600}
  VIDEO_TRANSCODE_PRESET: ${VIDEO_TRANSCODE_PRESET:-veryfast}
  VIDEO_TRANSCODE_CRF: ${VIDEO_TRANSCODE_CRF:-22}
  HLS_STREAMING_ENABLED: ${HLS_STREAMING_ENABLED:-True}
  HLS_MAX_HEIGHT: ${HLS_MAX_HEIGHT:-720}
  HLS_SEGMENT_SECONDS: ${HLS_SEGMENT_SECONDS:-6}
  HLS_TRANSCODE_TIMEOUT_SECONDS: ${HLS_TRANSCODE_TIMEOUT_SECONDS:-7200}
  HLS_TRANSCODE_PRESET: ${HLS_TRANSCODE_PRESET:-veryfast}
  HLS_AUDIO_ONLY_BITRATE: ${HLS_AUDIO_ONLY_BITRATE:-48k}
  HLS_DATA_SAVER_MAX_HEIGHT: ${HLS_DATA_SAVER_MAX_HEIGHT:-360}
  HLS_SEGMENT_CACHE_SECONDS: ${HLS_SEGMENT_CACHE_SECONDS:-600}
  OFFLINE_VIDEO_ENABLED: ${OFFLINE_VIDEO_ENABLED:-True}
  OFFLINE_VIDEO_MAX_HEIGHT: ${OFFLINE_VIDEO_MAX_HEIGHT:-360}
  OFFLINE_VIDEO_MAX_MB: ${OFFLINE_VIDEO_MAX_MB:-250}
  OFFLINE_PROGRESS_TOKEN_MAX_AGE: ${OFFLINE_PROGRESS_TOKEN_MAX_AGE:-2592000}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
  AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
  PLATFORM_COMMISSION_PERCENT: ${PLATFORM_COMMISSION_PERCENT:-15}
  MINIMUM_PAYOUT_AMOUNT: ${MINIMUM_PAYOUT_AMOUNT:-10}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-KalanPro <no-reply@kalanpro.com>}
  RESEND_ENABLED: ${RESEND_ENABLED:-False}
  RESEND_DRY_RUN: ${RESEND_DRY_RUN:-True}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_API_BASE: ${RESEND_API_BASE:-https://api.resend.com}
  RESEND_HTTP_TIMEOUT: ${RESEND_HTTP_TIMEOUT:-15}
  # Assistant IA KalanPro (clé uniquement côté backend)
  AI_API_KEY: ${AI_API_KEY:-}
  AI_API_BASE: ${AI_API_BASE:-https://api.openai.com/v1}
  AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
  AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-Compatible API}
  AI_HTTP_TIMEOUT: ${AI_HTTP_TIMEOUT:-60}
  AI_DRY_RUN: ${AI_DRY_RUN:-False}
  AI_INDEX_ASYNC: ${AI_INDEX_ASYNC:-True}
  AI_VISION_ENABLED: ${AI_VISION_ENABLED:-False}
  AI_REBUILD_INDEX_ON_BOOT: ${AI_REBUILD_INDEX_ON_BOOT:-False}
  WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-False}
  WHATSAPP_DRY_RUN: ${WHATSAPP_DRY_RUN:-True}
  WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v25.0}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_HTTP_TIMEOUT: ${WHATSAPP_HTTP_TIMEOUT:-15}
  SEED_DEMO: ${SEED_DEMO:-false}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learneas}
      POSTGRES_USER: ${POSTGRES_USER:-learneas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learneas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-learneas} -d ${POSTGRES_DB:-learneas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - learneas_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - learneas_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - backup_data:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learneas_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/ready/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "learneas", "worker", "--loglevel=info", "-Q", "default,notifications"]
    environment:
      <<: *backend-env
      SKIP_BOOTSTRAP: "true"
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learneas_net

  celery_media_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "learneas", "worker", "--loglevel=info", "-Q", "media", "--concurrency=1", "--prefetch-multiplier=1"]
    environment:
      <<: *backend-env
      SKIP_BOOTSTRAP: "true"
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learneas_net

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "learneas", "beat", "--loglevel=info"]
    environment:
      <<: *backend-env
      SKIP_BOOTSTRAP: "true"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learneas_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Les NEXT_PUBLIC_* sont figées dans le bundle navigateur au build.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_API_TIMEOUT_MS: ${NEXT_PUBLIC_API_TIMEOUT_MS:-15000}
        NEXT_PUBLIC_UPLOAD_TIMEOUT_MS: ${NEXT_PUBLIC_UPLOAD_TIMEOUT_MS:-600000}
        NEXT_PUBLIC_UPLOAD_PART_TIMEOUT_MS: ${NEXT_PUBLIC_UPLOAD_PART_TIMEOUT_MS:-300000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-2048}
        NEXT_PUBLIC_MEDIA_ORIGIN: ${NEXT_PUBLIC_MEDIA_ORIGIN:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_API_TIMEOUT_MS: ${NEXT_PUBLIC_API_TIMEOUT_MS:-15000}
      NEXT_PUBLIC_UPLOAD_TIMEOUT_MS: ${NEXT_PUBLIC_UPLOAD_TIMEOUT_MS:-600000}
      NEXT_PUBLIC_UPLOAD_PART_TIMEOUT_MS: ${NEXT_PUBLIC_UPLOAD_PART_TIMEOUT_MS:-300000}
      PUBLIC_API_TIMEOUT_MS: ${PUBLIC_API_TIMEOUT_MS:-8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
      NEXT_PUBLIC_MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-2048}
      NEXT_PUBLIC_MEDIA_ORIGIN: ${NEXT_PUBLIC_MEDIA_ORIGIN:-}
      # URL interne au réseau Docker, utilisée uniquement côté SSR.
      INTERNAL_API_URL: http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - learneas_net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - learneas_net

networks:
  learneas_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  backup_data:
