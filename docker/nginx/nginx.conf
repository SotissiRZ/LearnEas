upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:3000;
}

client_max_body_size 200M;

server {
    listen 80;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.stripe.com https://checkout.stripe.com stun: turn: turns: wss: ws:; frame-src https://checkout.stripe.com;" always;
    server_name _;

    # --- API Django ---
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin Django ---
    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Fichiers statiques Django (admin CSS/JS) ---
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Médias pédagogiques privés : accessibles uniquement via X-Accel-Redirect après signature Django.
    location /_protected_media/ {
        internal;
        alias /app/media/;
        add_header Cache-Control "private, no-store" always;
    }

    # Images de couverture/avatar publiques uniquement. Les vidéos/PDF/sous-titres sont bloqués.
    location ~ ^/media/courses/videos/ { return 404; }
    location ~ ^/media/courses/subtitles/ { return 404; }
    location ~ ^/media/courses/pdfs/(?!covers/) { return 404; }
    location ~ ^/media/pdfs/(files|previews)/ { return 404; }
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
    }

    # --- Frontend Next.js (catch-all) ---
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
