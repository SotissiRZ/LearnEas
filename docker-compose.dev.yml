# Usage développement (hot-reload) :
#   docker compose -f docker-compose.dev.yml up --build
#
# Backend accessible sur http://localhost:8000, frontend sur http://localhost:3000.
# Le code source est monté en volume : toute modification est prise en compte à chaud.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: learneas
      POSTGRES_USER: learneas
      POSTGRES_PASSWORD: learneas
    # PostgreSQL reste privé au réseau Docker en développement.
    # Pour l’inspecter : docker compose -f docker-compose.dev.yml exec db psql -U learneas -d learneas
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U learneas -d learneas"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - learneas_dev_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis reste privé au réseau Docker ; aucun port Windows n’est requis.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - learneas_dev_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    restart: unless-stopped
    environment:
      SECRET_KEY: dev-secret-key-kalanpro-local-only-2026
      DEBUG: "True"
      LOG_FORMAT: ${LOG_FORMAT:-console}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TEST_PAYMENTS_ENABLED: "True"
      ANON_THROTTLE_RATE: "10000/hour"
      USER_THROTTLE_RATE: "30000/hour"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgresql://learneas:learneas@db:5432/learneas
      REDIS_URL: redis://redis:6379/0
      USE_S3: ${USE_S3:-False}
      REQUIRE_REMOTE_MEDIA: ${REQUIRE_REMOTE_MEDIA:-False}
      DIRECT_MEDIA_UPLOADS_ENABLED: ${DIRECT_MEDIA_UPLOADS_ENABLED:-False}
      DIRECT_UPLOAD_PART_SIZE_MB: ${DIRECT_UPLOAD_PART_SIZE_MB:-16}
      DIRECT_UPLOAD_URL_TTL_SECONDS: ${DIRECT_UPLOAD_URL_TTL_SECONDS:-3600}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-}
      MEDIA_PUBLIC_CACHE_SECONDS: ${MEDIA_PUBLIC_CACHE_SECONDS:-31536000}
      MEDIA_PRIVATE_CACHE_CONTROL: ${MEDIA_PRIVATE_CACHE_CONTROL:-private, no-store}
      S3_CONNECT_TIMEOUT_SECONDS: ${S3_CONNECT_TIMEOUT_SECONDS:-3}
      S3_READ_TIMEOUT_SECONDS: ${S3_READ_TIMEOUT_SECONDS:-10}
      MULTIPART_UPLOAD_MAX_AGE_HOURS: ${MULTIPART_UPLOAD_MAX_AGE_HOURS:-24}
      MULTIPART_CLEANUP_MAX_ABORTS: ${MULTIPART_CLEANUP_MAX_ABORTS:-200}
      OPERATIONS_STORAGE_SCAN_MAX_OBJECTS: ${OPERATIONS_STORAGE_SCAN_MAX_OBJECTS:-2000}
      OPERATIONS_QUEUE_WARNING_DEPTH: ${OPERATIONS_QUEUE_WARNING_DEPTH:-100}
      REALTIME_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      RTC_STUN_URL: ${RTC_STUN_URL:-stun:stun.l.google.com:19302}
      RTC_TURN_URL: ${RTC_TURN_URL:-}
      RTC_TURN_SECRET: ${RTC_TURN_SECRET:-}
      RTC_TURN_TTL_SECONDS: ${RTC_TURN_TTL_SECONDS:-3600}
      RTC_TURN_USERNAME: ${RTC_TURN_USERNAME:-}
      RTC_TURN_CREDENTIAL: ${RTC_TURN_CREDENTIAL:-}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      SEED_DEMO: "true"
      PLATFORM_COMMISSION_PERCENT: "15"
      MINIMUM_PAYOUT_AMOUNT: "100"
      RESEND_ENABLED: ${RESEND_ENABLED:-False}
      RESEND_DRY_RUN: ${RESEND_DRY_RUN:-True}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_BASE: ${RESEND_API_BASE:-https://api.resend.com}
      RESEND_HTTP_TIMEOUT: ${RESEND_HTTP_TIMEOUT:-15}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-False}
      WHATSAPP_DRY_RUN: ${WHATSAPP_DRY_RUN:-True}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v25.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_HTTP_TIMEOUT: ${WHATSAPP_HTTP_TIMEOUT:-15}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE: ${AI_API_BASE:-https://api.openai.com/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-Compatible API}
      AI_HTTP_TIMEOUT: ${AI_HTTP_TIMEOUT:-60}
      AI_DRY_RUN: ${AI_DRY_RUN:-True}
      AI_INDEX_ASYNC: ${AI_INDEX_ASYNC:-False}
      AI_VISION_ENABLED: ${AI_VISION_ENABLED:-False}
      AI_REBUILD_INDEX_ON_BOOT: ${AI_REBUILD_INDEX_ON_BOOT:-True}
      DB_WAIT_MAX_ATTEMPTS: ${DB_WAIT_MAX_ATTEMPTS:-30}
      DB_WAIT_DELAY_SECONDS: ${DB_WAIT_DELAY_SECONDS:-2}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-3}
      MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-2048}
      VIDEO_NORMALIZATION_ENABLED: ${VIDEO_NORMALIZATION_ENABLED:-True}
      VIDEO_PROBE_TIMEOUT_SECONDS: ${VIDEO_PROBE_TIMEOUT_SECONDS:-120}
      VIDEO_TRANSCODE_TIMEOUT_SECONDS: ${VIDEO_TRANSCODE_TIMEOUT_SECONDS:-3600}
      VIDEO_TRANSCODE_PRESET: ${VIDEO_TRANSCODE_PRESET:-veryfast}
      VIDEO_TRANSCODE_CRF: ${VIDEO_TRANSCODE_CRF:-22}
      HLS_STREAMING_ENABLED: ${HLS_STREAMING_ENABLED:-True}
      HLS_MAX_HEIGHT: ${HLS_MAX_HEIGHT:-720}
      HLS_SEGMENT_SECONDS: ${HLS_SEGMENT_SECONDS:-6}
      HLS_TRANSCODE_TIMEOUT_SECONDS: ${HLS_TRANSCODE_TIMEOUT_SECONDS:-7200}
      HLS_TRANSCODE_PRESET: ${HLS_TRANSCODE_PRESET:-veryfast}
      HLS_AUDIO_ONLY_BITRATE: ${HLS_AUDIO_ONLY_BITRATE:-48k}
      HLS_DATA_SAVER_MAX_HEIGHT: ${HLS_DATA_SAVER_MAX_HEIGHT:-360}
      HLS_SEGMENT_CACHE_SECONDS: ${HLS_SEGMENT_CACHE_SECONDS:-600}
      OFFLINE_VIDEO_ENABLED: ${OFFLINE_VIDEO_ENABLED:-True}
      OFFLINE_VIDEO_MAX_HEIGHT: ${OFFLINE_VIDEO_MAX_HEIGHT:-360}
      OFFLINE_VIDEO_MAX_MB: ${OFFLINE_VIDEO_MAX_MB:-250}
      OFFLINE_PROGRESS_TOKEN_MAX_AGE: ${OFFLINE_PROGRESS_TOKEN_MAX_AGE:-2592000}
      MAX_IMAGE_UPLOAD_MB: ${MAX_IMAGE_UPLOAD_MB:-15}
      MAX_IMAGE_DIMENSION: ${MAX_IMAGE_DIMENSION:-12000}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-60000000}
      CLIENT_TELEMETRY_THROTTLE_RATE: ${CLIENT_TELEMETRY_THROTTLE_RATE:-60/hour}
      PRODUCT_ANALYTICS_THROTTLE_RATE: ${PRODUCT_ANALYTICS_THROTTLE_RATE:-500/hour}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-395}
      PAYMENT_RECONCILIATION_MIN_AGE_SECONDS: ${PAYMENT_RECONCILIATION_MIN_AGE_SECONDS:-120}
      PAYMENT_RECONCILIATION_BATCH_SIZE: ${PAYMENT_RECONCILIATION_BATCH_SIZE:-100}
      PAYMENT_ORDER_EXPIRY_HOURS: ${PAYMENT_ORDER_EXPIRY_HOURS:-24}
      PAYMENT_STALE_BATCH_SIZE: ${PAYMENT_STALE_BATCH_SIZE:-200}
      COHORT_WAITLIST_OFFER_HOURS: ${COHORT_WAITLIST_OFFER_HOURS:-24}
    volumes:
      - ./backend:/app
      - static_data_dev:/app/staticfiles
      - media_data_dev:/app/media
      - backup_data_dev:/app/backups
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Docker vérifie uniquement la vie du processus Django. La readiness DB/Redis
      # reste disponible sur /api/health/ready/ pour le monitoring sans créer de
      # cascade "backend unhealthy" lors d'une panne Redis transitoire.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health/live/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5m
    networks:
      - learneas_dev_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "learneas", "worker", "--loglevel=info", "-Q", "default,notifications"]
    restart: unless-stopped
    environment:
      SECRET_KEY: dev-secret-key-kalanpro-local-only-2026
      DEBUG: "True"
      SKIP_BOOTSTRAP: "true"
      DATABASE_URL: postgresql://learneas:learneas@db:5432/learneas
      REDIS_URL: redis://redis:6379/0
      USE_S3: ${USE_S3:-False}
      REQUIRE_REMOTE_MEDIA: ${REQUIRE_REMOTE_MEDIA:-False}
      DIRECT_MEDIA_UPLOADS_ENABLED: ${DIRECT_MEDIA_UPLOADS_ENABLED:-False}
      DIRECT_UPLOAD_PART_SIZE_MB: ${DIRECT_UPLOAD_PART_SIZE_MB:-16}
      DIRECT_UPLOAD_URL_TTL_SECONDS: ${DIRECT_UPLOAD_URL_TTL_SECONDS:-3600}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-}
      MEDIA_PUBLIC_CACHE_SECONDS: ${MEDIA_PUBLIC_CACHE_SECONDS:-31536000}
      MEDIA_PRIVATE_CACHE_CONTROL: ${MEDIA_PRIVATE_CACHE_CONTROL:-private, no-store}
      S3_CONNECT_TIMEOUT_SECONDS: ${S3_CONNECT_TIMEOUT_SECONDS:-3}
      S3_READ_TIMEOUT_SECONDS: ${S3_READ_TIMEOUT_SECONDS:-10}
      MULTIPART_UPLOAD_MAX_AGE_HOURS: ${MULTIPART_UPLOAD_MAX_AGE_HOURS:-24}
      MULTIPART_CLEANUP_MAX_ABORTS: ${MULTIPART_CLEANUP_MAX_ABORTS:-200}
      OPERATIONS_STORAGE_SCAN_MAX_OBJECTS: ${OPERATIONS_STORAGE_SCAN_MAX_OBJECTS:-2000}
      OPERATIONS_QUEUE_WARNING_DEPTH: ${OPERATIONS_QUEUE_WARNING_DEPTH:-100}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      RESEND_ENABLED: ${RESEND_ENABLED:-False}
      RESEND_DRY_RUN: ${RESEND_DRY_RUN:-True}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-False}
      WHATSAPP_DRY_RUN: ${WHATSAPP_DRY_RUN:-True}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v25.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_HTTP_TIMEOUT: ${WHATSAPP_HTTP_TIMEOUT:-15}
      COHORT_WAITLIST_OFFER_HOURS: ${COHORT_WAITLIST_OFFER_HOURS:-24}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-395}
    volumes:
      - ./backend:/app
      - media_data_dev:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learneas_dev_net

  celery_media_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "learneas", "worker", "--loglevel=info", "-Q", "media", "--concurrency=1", "--prefetch-multiplier=1"]
    restart: unless-stopped
    environment:
      SECRET_KEY: dev-secret-key-kalanpro-local-only-2026
      DEBUG: "True"
      SKIP_BOOTSTRAP: "true"
      DATABASE_URL: postgresql://learneas:learneas@db:5432/learneas
      REDIS_URL: redis://redis:6379/0
      USE_S3: ${USE_S3:-False}
      REQUIRE_REMOTE_MEDIA: ${REQUIRE_REMOTE_MEDIA:-False}
      DIRECT_MEDIA_UPLOADS_ENABLED: ${DIRECT_MEDIA_UPLOADS_ENABLED:-False}
      DIRECT_UPLOAD_PART_SIZE_MB: ${DIRECT_UPLOAD_PART_SIZE_MB:-16}
      DIRECT_UPLOAD_URL_TTL_SECONDS: ${DIRECT_UPLOAD_URL_TTL_SECONDS:-3600}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-}
      MEDIA_PUBLIC_CACHE_SECONDS: ${MEDIA_PUBLIC_CACHE_SECONDS:-31536000}
      MEDIA_PRIVATE_CACHE_CONTROL: ${MEDIA_PRIVATE_CACHE_CONTROL:-private, no-store}
      S3_CONNECT_TIMEOUT_SECONDS: ${S3_CONNECT_TIMEOUT_SECONDS:-3}
      S3_READ_TIMEOUT_SECONDS: ${S3_READ_TIMEOUT_SECONDS:-10}
      MULTIPART_UPLOAD_MAX_AGE_HOURS: ${MULTIPART_UPLOAD_MAX_AGE_HOURS:-24}
      MULTIPART_CLEANUP_MAX_ABORTS: ${MULTIPART_CLEANUP_MAX_ABORTS:-200}
      OPERATIONS_STORAGE_SCAN_MAX_OBJECTS: ${OPERATIONS_STORAGE_SCAN_MAX_OBJECTS:-2000}
      OPERATIONS_QUEUE_WARNING_DEPTH: ${OPERATIONS_QUEUE_WARNING_DEPTH:-100}
      MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-2048}
      VIDEO_NORMALIZATION_ENABLED: ${VIDEO_NORMALIZATION_ENABLED:-True}
      VIDEO_PROBE_TIMEOUT_SECONDS: ${VIDEO_PROBE_TIMEOUT_SECONDS:-120}
      VIDEO_TRANSCODE_TIMEOUT_SECONDS: ${VIDEO_TRANSCODE_TIMEOUT_SECONDS:-3600}
      VIDEO_TRANSCODE_PRESET: ${VIDEO_TRANSCODE_PRESET:-veryfast}
      VIDEO_TRANSCODE_CRF: ${VIDEO_TRANSCODE_CRF:-22}
      HLS_STREAMING_ENABLED: ${HLS_STREAMING_ENABLED:-True}
      HLS_MAX_HEIGHT: ${HLS_MAX_HEIGHT:-720}
      HLS_SEGMENT_SECONDS: ${HLS_SEGMENT_SECONDS:-6}
      HLS_TRANSCODE_TIMEOUT_SECONDS: ${HLS_TRANSCODE_TIMEOUT_SECONDS:-7200}
      HLS_TRANSCODE_PRESET: ${HLS_TRANSCODE_PRESET:-veryfast}
      HLS_AUDIO_ONLY_BITRATE: ${HLS_AUDIO_ONLY_BITRATE:-48k}
      HLS_DATA_SAVER_MAX_HEIGHT: ${HLS_DATA_SAVER_MAX_HEIGHT:-360}
      HLS_SEGMENT_CACHE_SECONDS: ${HLS_SEGMENT_CACHE_SECONDS:-600}
      OFFLINE_VIDEO_ENABLED: ${OFFLINE_VIDEO_ENABLED:-True}
      OFFLINE_VIDEO_MAX_HEIGHT: ${OFFLINE_VIDEO_MAX_HEIGHT:-360}
      OFFLINE_VIDEO_MAX_MB: ${OFFLINE_VIDEO_MAX_MB:-250}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-395}
    volumes:
      - ./backend:/app
      - media_data_dev:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learneas_dev_net

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "learneas", "beat", "--loglevel=info"]
    restart: unless-stopped
    environment:
      SECRET_KEY: dev-secret-key-kalanpro-local-only-2026
      DEBUG: "True"
      SKIP_BOOTSTRAP: "true"
      DATABASE_URL: postgresql://learneas:learneas@db:5432/learneas
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      RESEND_ENABLED: ${RESEND_ENABLED:-False}
      RESEND_DRY_RUN: ${RESEND_DRY_RUN:-True}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-False}
      WHATSAPP_DRY_RUN: ${WHATSAPP_DRY_RUN:-True}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v25.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_HTTP_TIMEOUT: ${WHATSAPP_HTTP_TIMEOUT:-15}
      COHORT_WAITLIST_OFFER_HOURS: ${COHORT_WAITLIST_OFFER_HOURS:-24}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-395}
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learneas_dev_net

  frontend:
    image: node:20-slim
    working_dir: /app
    # Le volume node_modules est persistant : inutile de refaire `npm install` à chaque restart.
    # Turbopack (script npm dev) réduit aussi fortement la compilation à froid des routes en local.
    command: sh -c "test -x node_modules/.bin/next || npm ci --no-audit --no-fund; npm run dev"
    restart: unless-stopped
    environment:
      # Same-origin : le navigateur parle à Next (/api), qui proxy vers le backend Docker.
      # Cela supprime les préflights CORS répétés et rend les cookies HttpOnly plus fiables.
      NEXT_PUBLIC_API_URL: /api
      API_PROXY_TARGET: http://backend:8000
      NEXT_PUBLIC_API_TIMEOUT_MS: ${NEXT_PUBLIC_API_TIMEOUT_MS:-15000}
      NEXT_PUBLIC_UPLOAD_TIMEOUT_MS: ${NEXT_PUBLIC_UPLOAD_TIMEOUT_MS:-600000}
      NEXT_PUBLIC_UPLOAD_PART_TIMEOUT_MS: ${NEXT_PUBLIC_UPLOAD_PART_TIMEOUT_MS:-300000}
      PUBLIC_API_TIMEOUT_MS: ${PUBLIC_API_TIMEOUT_MS:-8000}
      NEXT_PUBLIC_WS_URL: ws://localhost:${BACKEND_PORT:-8000}/ws
      # Comme en production : côté serveur (SSR), "localhost" désignerait ce conteneur
      # lui-même. On utilise le nom du service Docker pour joindre le backend en interne.
      INTERNAL_API_URL: http://backend:8000/api
      # Racine logique utilisée par les tests structurels. Seuls les chemins
      # nécessaires sont montés en lecture seule (pas de backend/.env ni de secrets).
      KALANPRO_REPO_ROOT: /workspace
    volumes:
      - ./frontend:/app
      - ./backend/apps:/workspace/backend/apps:ro
      - ./backend/learneas:/workspace/backend/learneas:ro
      - ./backend/Dockerfile:/workspace/backend/Dockerfile:ro
      - ./docker:/workspace/docker:ro
      - ./.github:/workspace/.github:ro
      - ./.gitignore:/workspace/.gitignore:ro
      - ./docker-compose.dev.yml:/workspace/docker-compose.dev.yml:ro
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      - frontend_node_modules:/app/node_modules
      # Isole les artefacts Next du bind-mount Windows. Le build de validation utilise
      # un autre distDir et ne peut donc plus corrompre le serveur `next dev`.
      - frontend_next_dev:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - learneas_dev_net

networks:
  learneas_dev_net:
    driver: bridge

volumes:
  postgres_data_dev:
  static_data_dev:
  media_data_dev:
  frontend_node_modules:
  frontend_next_dev:
  backup_data_dev:
