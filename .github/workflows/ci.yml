name: KalanPro CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learneas
          POSTGRES_USER: learneas
          POSTGRES_PASSWORD: learneas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U learneas -d learneas"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://learneas:learneas@127.0.0.1:5432/learneas
      REDIS_URL: redis://127.0.0.1:6379/0
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      REALTIME_ALLOWED_ORIGINS: http://localhost:3000
      SEED_DEMO: "false"
      TEST_PAYMENTS_ENABLED: "false"
      RESEND_ENABLED: "false"
      WHATSAPP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        run: python manage.py check
      - working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - working-directory: backend
        run: python manage.py migrate --noinput
      - working-directory: backend
        run: python manage.py release_gate --json
      - working-directory: backend
        run: python manage.py test
      - working-directory: backend
        run: python manage.py check --deploy

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm run test:ci
      - working-directory: frontend
        run: npm run build:check


  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start integration stack
        run: docker compose -f docker-compose.dev.yml up -d --build
      - name: Wait for frontend liveness
        run: |
          for i in $(seq 1 24); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose -f docker-compose.dev.yml ps
          docker compose -f docker-compose.dev.yml logs --tail=200 backend frontend
          exit 1
      - name: Release qualification (smoke + chaos + bounded load)
        run: docker compose -f docker-compose.dev.yml exec -T frontend npm run release:qualify:dev
      - name: Backend release gate
        run: docker compose -f docker-compose.dev.yml exec -T backend python manage.py release_gate --json
      - name: Integration logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail=250 backend frontend redis db celery_worker celery_media_worker
      - name: Stop integration stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down
