name: KalanPro CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learneas
          POSTGRES_USER: learneas
          POSTGRES_PASSWORD: learneas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U learneas -d learneas"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://learneas:learneas@127.0.0.1:5432/learneas
      REDIS_URL: redis://127.0.0.1:6379/0
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      REALTIME_ALLOWED_ORIGINS: http://localhost:3000
      SEED_DEMO: "false"
      TEST_PAYMENTS_ENABLED: "false"
      RESEND_ENABLED: "false"
      WHATSAPP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        run: python manage.py check
      - working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - working-directory: backend
        run: python manage.py migrate --noinput
      - working-directory: backend
        run: python manage.py release_gate --json
      - working-directory: backend
        run: python manage.py test
      - working-directory: backend
        run: python manage.py check --deploy
      - name: Production configuration contract
        working-directory: backend
        env:
          DEBUG: "False"
          USE_HTTPS: "True"
          SECRET_KEY: ci-production-contract-secret-key-0123456789
          ALLOWED_HOSTS: api.example.com
          DATABASE_URL: postgresql://user:pass@db.example.internal:5432/kalanpro
          REDIS_URL: redis://redis.example.internal:6379/0
          FRONTEND_URL: https://app.example.com
          BACKEND_PUBLIC_URL: https://api.example.com
          CORS_ALLOWED_ORIGINS: https://app.example.com
          REALTIME_ALLOWED_ORIGINS: https://app.example.com
          CSRF_TRUSTED_ORIGINS: https://app.example.com
          AUTH_REFRESH_COOKIE_SECURE: "True"
          TEST_PAYMENTS_ENABLED: "False"
          SEED_DEMO: "False"
          USE_S3: "True"
          REQUIRE_REMOTE_MEDIA: "True"
          DIRECT_MEDIA_UPLOADS_ENABLED: "True"
          AWS_ACCESS_KEY_ID: ci-access
          AWS_SECRET_ACCESS_KEY: ci-secret
          AWS_STORAGE_BUCKET_NAME: kalanpro-ci
          AWS_S3_REGION_NAME: auto
          AWS_S3_ENDPOINT_URL: https://storage.example.com
          MALWARE_SCAN_ENABLED: "True"
          MALWARE_SCAN_REQUIRED: "True"
          CLAMAV_HOST: clamav.example.internal
          CINETPAY_API_KEY: ci-key
          CINETPAY_SITE_ID: ci-site
          CINETPAY_SECRET_KEY: ci-secret
          RESEND_ENABLED: "True"
          RESEND_DRY_RUN: "False"
          RESEND_API_KEY: re_ci_placeholder
          DEFAULT_FROM_EMAIL: KalanPro <no-reply@example.com>
          RTC_TURN_URLS: turns:turn.example.com:5349?transport=tcp
          RTC_TURN_SECRET: ci-turn-secret
          AI_DRY_RUN: "True"
        run: python manage.py production_preflight --json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm run test:ci
      - working-directory: frontend
        run: npm run build:check
      - name: Frontend production configuration contract
        working-directory: frontend
        env:
          API_PROXY_TARGET: https://api.example.com
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_WS_URL: wss://api.example.com/ws
          NEXT_PUBLIC_MEDIA_ORIGIN: https://media.example.com
        run: npm run production:preflight


  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start integration stack
        run: docker compose -f docker-compose.dev.yml up -d --build
      - name: Wait for frontend liveness
        run: |
          for i in $(seq 1 24); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose -f docker-compose.dev.yml ps
          docker compose -f docker-compose.dev.yml logs --tail=200 backend frontend
          exit 1
      - name: Release qualification (smoke + chaos + bounded load)
        run: docker compose -f docker-compose.dev.yml exec -T frontend npm run release:qualify:dev
      - name: Backend release gate
        run: docker compose -f docker-compose.dev.yml exec -T backend python manage.py release_gate --json
      - name: Integration logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail=250 backend frontend redis db celery_worker celery_media_worker
      - name: Stop integration stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down
