<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>KalanPro · Vidéos hors connexion</title>
  <style>
    :root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}.top{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 16px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:980px;margin:auto}.brand strong{font-size:18px}.pill{font-size:12px;padding:5px 9px;border-radius:999px;background:#f1f5f9;color:#475569}.wrap{max-width:980px;margin:auto;padding:18px 16px 64px}.notice{font-size:13px;line-height:1.5;color:#475569;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px 14px;margin-bottom:16px}.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(15,23,42,.04)}.card h2{font-size:15px;margin:0 0 6px}.meta{font-size:12px;color:#64748b}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button,a.btn{appearance:none;border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none}.primary{background:#0f766e;color:#fff}.danger{background:#fff1f2;color:#be123c;border:1px solid #fecdd3!important}.ghost{background:#f1f5f9;color:#334155}.player{display:none;margin-bottom:18px;background:#020617;border-radius:18px;overflow:hidden}.player.active{display:block}.player video{display:block;width:100%;max-height:70vh;background:#000}.playerInfo{background:#fff;padding:12px 14px;border-top:1px solid #e2e8f0}.empty{text-align:center;padding:48px 20px;background:#fff;border:1px dashed #cbd5e1;border-radius:16px;color:#64748b}.small{font-size:11px;color:#64748b;margin-top:6px}@media(min-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><strong>KalanPro · Hors connexion</strong><span id="network" class="pill">Connexion…</span></div></header>
  <main class="wrap">
    <div class="notice">Les vidéos affichées ici ont été enregistrées volontairement sur cet appareil. Leur progression est conservée localement puis synchronisée lorsque vous revenez sur KalanPro avec Internet.</div>
    <section id="player" class="player"><video id="video" controls playsinline preload="metadata"></video><div class="playerInfo"><strong id="playerTitle"></strong><div id="playerMeta" class="small"></div></div></section>
    <div id="list" class="grid"></div>
  </main>
<script src="/offline-player.js" defer></script>
</body>
</html>
